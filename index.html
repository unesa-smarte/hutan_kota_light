<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GIS PJU Hutan Kota Unesa</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
        /* Style untuk Popup Peta */
        .popup-content {
            width: 200px;
            text-align: center;
        }
        .popup-content img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .popup-content h4 {
            margin: 5px 0;
            color: #333;
        }
        .popup-content p {
            margin: 3px 0;
            font-size: 13px;
            color: #666;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            margin-top: 4px;
        }
        .badge-normal { background-color: #28a745; }
        .badge-mati { background-color: #dc3545; }
        .badge-proposed { background-color: #ffc107; color: #000; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Inisialisasi Peta (Center ke titik koordinat PJU Anda)
        const map = L.map('map').setView([-7.3004, 112.6710], 18);

        // 2. Tambahkan Layer OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. Fungsi untuk Menentukan Warna Marker (Circle Marker)
        function getColor(item) {
            if (item.status === 'existing') {
                return item.kondisi === 'mati' ? '#e74c3c' : '#2ecc71'; // Merah jika Mati, Hijau jika Normal
            } else if (item.status === 'proposed') {
                return '#f1c40f'; // Kuning
            }
            return '#95a5a6'; // Default Abu-abu
        }

        // 4. Load Data JSON
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                data.forEach(item => {
                    // Buat Circle Marker dengan warna sesuai kondisi
                    const marker = L.circleMarker([item.lat, item.lon], {
                        radius: 8,
                        fillColor: getColor(item),
                        color: "#ffffff", // Outline putih
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).addTo(map);

                    // Buat Konten Popup
                    let popupHTML = `
                        <div class="popup-content">
                            <img src="${item.file}" alt="${item.nama}" onerror="this.src='https://via.placeholder.com/200x120?text=Gambar+Tidak+Ada'">
                            <h4>${item.nama}</h4>
                            <p><b>Model:</b> ${item.model}</p>
                            <p><b>Status:</b> ${item.status.toUpperCase()}</p>
                    `;

                    // Tambahkan info kondisi hanya jika status == existing
                    if (item.status === 'existing') {
                        const badgeClass = item.kondisi === 'normal' ? 'badge-normal' : 'badge-mati';
                        popupHTML += `<p><b>Kondisi:</b> <span class="badge ${badgeClass}">${item.kondisi.toUpperCase()}</span></p>`;
                    }

                    popupHTML += `</div>`;

                    // Bind Popup ke Marker
                    marker.bindPopup(popupHTML);
                });
            })
            .catch(error => console.error('Gagal memuat data JSON:', error));
    </script>
</body>
</html>
