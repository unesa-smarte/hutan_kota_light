<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GIS PJU - Hutan Kota Unesa Lidah Wetan</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }

        /* Style Popup Peta */
        .popup-content {
            width: 200px;
            text-align: center;
        }
        .popup-content img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .popup-content h4 {
            margin: 5px 0;
            color: #333;
        }
        .popup-content p {
            margin: 3px 0;
            font-size: 13px;
            color: #666;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            margin-top: 4px;
        }
        .badge-normal { background-color: #28a745; }
        .badge-mati { background-color: #dc3545; }

        /* Style untuk Kotak Judul dan Legenda */
        .map-legend {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            font-size: 13px;
            line-height: 20px;
            color: #333;
            max-width: 230px;
        }
        .map-legend h3 {
            margin: 0 0 5px 0;
            font-size: 15px;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 4px;
        }
        .map-legend h4 {
            margin: 8px 0 6px 0;
            font-size: 13px;
            color: #555;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .legend-item img {
            width: 18px;
            height: 28px;
            margin-right: 10px;
        }
        .count-badge {
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Inisialisasi Peta
        const map = L.map('map').setView([-7.3004, 112.6710], 19);

        // 2. Load Layer Tile OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. Menambahkan Kotak Judul & Legenda (Disiapkan dengan ID Elemen untuk Count)
        const legend = L.control({ position: 'topright' });

        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'map-legend');
            div.innerHTML = `
                <h3>WEB GIS PJU - Hutan Kota Unesa Lidah Wetan</h3>
                <h4>Legenda Marker:</h4>
                <div class="legend-item">
                    <img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png" alt="Hijau">
                    <span>Existing (Normal): <span id="count-normal" class="count-badge">0</span></span>
                </div>
                <div class="legend-item">
                    <img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png" alt="Merah">
                    <span>Existing (Shadow/Mati): <span id="count-mati" class="count-badge">0</span></span>
                </div>
                <div class="legend-item">
                    <img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-yellow.png" alt="Kuning">
                    <span>Proposed: <span id="count-proposed" class="count-badge">0</span></span>
                </div>
            `;
            return div;
        };

        legend.addTo(map);

        // 4. Fungsi Menentukan URL Gambar Marker Pin
        function getMarkerUrl(item) {
            if (item.status === 'existing') {
                return item.kondisi === 'mati' 
                    ? 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png'
                    : 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png';
            } else if (item.status === 'proposed') {
                return 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-yellow.png';
            }
            return 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-grey.png';
        }

        // 5. Load File data.json & Hitung Jumlah Marker
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                // Inisialisasi variabel hitung
                let countNormal = 0;
                let countMati = 0;
                let countProposed = 0;

                data.forEach(item => {
                    // Akumulasi Hitungan berdasarkan Kategori
                    if (item.status === 'existing') {
                        if (item.kondisi === 'normal') countNormal++;
                        else if (item.kondisi === 'mati') countMati++;
                    } else if (item.status === 'proposed') {
                        countProposed++;
                    }

                    // Buat Icon Marker
                    const customIcon = L.icon({
                        iconUrl: getMarkerUrl(item),
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        shadowSize: [41, 41]
                    });

                    // Pasang Marker ke Peta
                    const marker = L.marker([item.lat, item.lon], { icon: customIcon }).addTo(map);

                    // Buat Popup Content
                    let popupHTML = `
                        <div class="popup-content">
                            <img src="${item.file}" alt="${item.nama}" onerror="this.src='https://via.placeholder.com/200x220?text=Gambar+Tidak+Ada'">
                            <h4>${item.nama}</h4>
                            <p><b>Model:</b> ${item.model}</p>
                            <p><b>Status:</b> ${item.status.toUpperCase()}</p>
                    `;

                    if (item.status === 'existing') {
                        const badgeClass = item.kondisi === 'normal' ? 'badge-normal' : 'badge-mati';
                        popupHTML += `<p><b>Kondisi:</b> <span class="badge ${badgeClass}">${item.kondisi.toUpperCase()}</span></p>`;
                    }

                    popupHTML += `</div>`;
                    marker.bindPopup(popupHTML);
                });

                // Perbarui Teks Jumlah di Legenda secara Dinamis
                document.getElementById('count-normal').innerText = countNormal;
                document.getElementById('count-mati').innerText = countMati;
                document.getElementById('count-proposed').innerText = countProposed;
            })
            .catch(error => console.error('Gagal memuat data.json:', error));
    </script>
</body>
</html>
