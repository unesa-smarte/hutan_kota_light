<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GIS PJU - Hutan Kot Unesa</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
        /* Style Popup Peta */
        .popup-content {
            width: 200px;
            text-align: center;
        }
        /* Gambar diset memanjang secara vertikal */
        .popup-content img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .popup-content h4 {
            margin: 5px 0;
            color: #333;
        }
        .popup-content p {
            margin: 3px 0;
            font-size: 13px;
            color: #666;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            margin-top: 4px;
        }
        .badge-normal { background-color: #28a745; }
        .badge-mati { background-color: #dc3545; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Inisialisasi Peta (Center ke titik lokasi PJU dan Zoom Start 19)
        const map = L.map('map').setView([-7.3004, 112.6710], 19);

        // 2. Load Layer Tile OpenStreetMap (maxZoom disesuaikan ke 20)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. Fungsi Menentukan URL Gambar Marker Pin Berdasarkan Status & Kondisi
        function getMarkerUrl(item) {
            if (item.status === 'existing') {
                return item.kondisi === 'mati' 
                    ? 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png'   // Merah jika Mati
                    : 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png'; // Hijau jika Normal
            } else if (item.status === 'proposed') {
                return 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-yellow.png'; // Kuning jika Proposed
            }
            return 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-grey.png';
        }

        // 4. Load File data.json
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                data.forEach(item => {
                    // Buat icon tear-drop kustom sesuai dengan status/kondisi
                    const customIcon = L.icon({
                        iconUrl: getMarkerUrl(item),
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        shadowSize: [41, 41]
                    });

                    // Pasang Marker di Peta
                    const marker = L.marker([item.lat, item.lon], { icon: customIcon }).addTo(map);

                    // Buat Tampilan HTML Popup
                    let popupHTML = `
                        <div class="popup-content">
                            <img src="${item.file}" alt="${item.nama}" onerror="this.src='https://via.placeholder.com/200x220?text=Gambar+Tidak+Ada'">
                            <h4>${item.nama}</h4>
                            <p><b>Model:</b> ${item.model}</p>
                            <p><b>Status:</b> ${item.status.toUpperCase()}</p>
                    `;

                    // Tampilkan Informasi Kondisi HANYA jika Status adalah Existing
                    if (item.status === 'existing') {
                        const badgeClass = item.kondisi === 'normal' ? 'badge-normal' : 'badge-mati';
                        popupHTML += `<p><b>Kondisi:</b> <span class="badge ${badgeClass}">${item.kondisi.toUpperCase()}</span></p>`;
                    }

                    popupHTML += `</div>`;

                    // Hubungkan Popup ke Marker
                    marker.bindPopup(popupHTML);
                });
            })
            .catch(error => console.error('Gagal memuat data.json:', error));
    </script>
</body>
</html>
